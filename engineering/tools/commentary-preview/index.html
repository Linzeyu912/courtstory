<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>看见解说 · Astra 视频预览</title>
<style>
:root{color-scheme:dark;--bg:#0d1219;--line:#29323e;--ink:#eef0e7;--muted:#99a6b8;--accent:#d4ef83;--amber:#ffcb75}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Microsoft YaHei","PingFang SC",sans-serif}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}header{padding:30px 36px 24px;display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid var(--line)}.eyebrow{color:var(--accent);font:12px Consolas,monospace;letter-spacing:.2em;margin:0 0 8px}h1{font:36px/1.2 "Noto Serif SC","SimSun",serif;margin:0;font-weight:500}.intro{margin:9px 0 0;color:var(--muted)}.version{color:var(--muted);font-size:12px;text-align:right}.tabs{display:flex;gap:8px;padding:20px 36px 22px}.tabs button{border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 18px;border-radius:3px}.tabs button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#172112}main{padding:0 36px 32px;display:grid;grid-template-columns:minmax(0,1.8fr) minmax(300px,1fr);gap:28px;align-items:start}.screen{background:#05080d;border:1px solid var(--line)}video{width:100%;display:block;aspect-ratio:1280/880;background:black}.transport{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0}.transport button{padding:8px 15px;color:var(--ink);border:1px solid var(--line);background:#1b2431;border-radius:3px}.transport button.primary{background:var(--accent);color:#142011;border-color:var(--accent)}.transport a{margin-left:auto;color:var(--muted);font-size:13px;text-underline-offset:4px}.clock{font:13px Consolas,monospace;color:var(--muted)}.timebar{height:7px;background:#222c37;position:relative;margin:5px 0 18px}.timebar i{position:absolute;height:7px;background:var(--accent);min-width:3px;cursor:pointer}.timebar i.hold{background:var(--amber)}.timebar .head{position:absolute;top:-3px;width:2px;height:13px;background:#fff;pointer-events:none}.note{color:var(--muted);font-size:12px;margin-top:12px}details{border-top:1px solid var(--line);margin-top:24px;padding-top:14px;color:var(--muted);font-size:13px}summary{cursor:pointer;color:var(--ink)}aside{border-top:2px solid var(--accent)}.aside-head{display:flex;justify-content:space-between;align-items:baseline;padding:15px 0;color:var(--muted);font-size:12px}.aside-head strong{color:var(--ink);font-size:18px;font-weight:500}.cue{display:block;text-align:left;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:17px 14px 17px 0;color:var(--ink);position:relative;transition:background .15s}.cue:hover{background:#17212d}.cue.active{background:#202d25;box-shadow:inset 3px 0 var(--accent);padding-left:14px}.cue.hold.active{background:#30291f;box-shadow:inset 3px 0 var(--amber)}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font:12px/1.6 Consolas,"Microsoft YaHei",sans-serif}.badge{color:var(--accent)}.hold .badge{color:var(--amber)}.cue p{font-size:16px;line-height:1.8;margin:8px 0 5px}.cue small{color:var(--muted);display:block;line-height:1.6;font-size:11px}.status{font-size:12px;color:var(--accent);margin-bottom:8px;min-height:20px}footer{border-top:1px solid var(--line);padding:16px 36px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:16px}@media(max-width:900px){header{padding:24px 18px;align-items:start}.version{display:none}.tabs{padding:16px 18px}main{padding:0 18px 24px;grid-template-columns:1fr;gap:16px}h1{font-size:30px}footer{padding:16px 18px}.transport{gap:8px}.transport a{margin-left:0}}
</style>
<header><div><p class="eyebrow">COMMENTARY / VIDEO REVIEW</p><h1>看见解说</h1><p class="intro">让每句话，回到它对应的画面。</p></div><div class="version">ASTRA · 原始解说<br>文字预览 / 无合成配音</div></header>
<nav class="tabs" role="tablist" aria-label="选择样片"></nav>
<main><section><div class="status" id="status" aria-live="polite"></div><div class="screen"><video id="video" controls playsinline preload="metadata" aria-label="视频与解说同步预览"></video></div><div class="transport"><button class="primary" id="play">播放预览</button><button id="restart">从头看</button><span class="clock" id="clock">原片 0.00s</span><a id="download" download>下载 MP4</a></div><div class="timebar" id="timeline" aria-label="解说分布"></div><div class="note">绿色：随画面解说　·　黄色：定格讲解<br>暂停段已留出阅读时间。画面下方显示原片时间，播放器显示含定格的预览时间。</div><details><summary>查看这段视频的理解摘要</summary><p id="summary"></p></details></section><aside><div class="aside-head"><strong>解说时间轴</strong><span>点击任一句，跳到画面</span></div><div id="cues"></div></aside></main>
<footer><span>当前文本保留模型原稿，便于核对时机、重点和表述。</span><span id="duration"></span></footer>
<script>
const DATA=/*PREVIEW_DATA*/;
const video=document.querySelector('#video');let clip, raf;
const clock=document.querySelector('#clock'), status=document.querySelector('#status'), play=document.querySelector('#play');
function sourceAt(t){const s=clip.segments.find(s=>t>=s.previewStart&&t<s.previewEnd)||clip.segments.at(-1);return {s,time:s.kind==='hold'?s.sourceStart:Math.min(s.sourceEnd,s.sourceStart+t-s.previewStart)}}
function activeAt(t){return clip.cues.find(c=>t>=c.previewStart&&t<c.previewEnd)}
function update(){if(!clip)return;const t=video.currentTime,{s,time}=sourceAt(t),active=activeAt(t);clock.textContent=`原片 ${time.toFixed(2)}s / 预览 ${t.toFixed(2)}s`;status.textContent=s.kind==='hold'?(video.paused?'已定位讲解点 · 点击播放查看定格与续播':(clip.audio==='volcengine_tts'?'定格讲解中 · 配音结束后继续':'画面定格中 · 阅读解说后自动继续')):active?(video.paused?'已定位解说 · 点击播放':'画面与解说同步播放'):'观察画面 · 等待下一句';document.querySelectorAll('.cue').forEach(el=>{const yes=el.dataset.id===active?.cueId;el.classList.toggle('active',yes);el.setAttribute('aria-current',yes?'true':'false')});document.querySelector('.head').style.left=`${Math.min(100,t/clip.duration*100)}%`;play.textContent=video.paused?'播放预览':'暂停';}
function tick(){update();raf=requestAnimationFrame(tick)}
function jump(t){video.currentTime=t;video.pause();update();if(innerWidth<=900)video.scrollIntoView({block:"start",behavior:"smooth"})}
function select(index){video.pause();clip=DATA.clips[index];video.src=clip.video;video.poster=clip.poster||'';video.style.aspectRatio=clip.aspectRatio||'1280/880';document.querySelector('.version').textContent=clip.audio==='amazon_polly'?'ASTRA 解说 · Amazon Polly 配音':clip.audio==='volcengine_tts'?'ASTRA 解说 · 火山 Seed TTS 2.0 配音':'ASTRA 原始解说 · 无合成配音';document.querySelector('.note').textContent=['amazon_polly','volcengine_tts'].includes(clip.audio)?'绿色：同步配音 · 黄色：定格讲解。暂停时长由真实配音决定；原声已压低，字幕烧录在原视频上方。':'绿色：随画面解说 · 黄色：定格讲解。暂停段已留出阅读时间；播放器显示含定格的预览时间。';document.querySelector('#summary').textContent=clip.summary;document.querySelector('#duration').textContent=`原片 ${clip.sourceDuration.toFixed(2)} 秒 → 预览 ${clip.duration.toFixed(2)} 秒`;const link=document.querySelector('#download');link.href=clip.video;document.querySelectorAll('[role=tab]').forEach((b,i)=>b.setAttribute('aria-selected',i===index?'true':'false'));const list=document.querySelector('#cues');list.replaceChildren();const timeline=document.querySelector('#timeline');timeline.replaceChildren();clip.cues.forEach((c,i)=>{const b=document.createElement('button');b.className=`cue ${(c.delivery==='pause'||c.convertedToHold)?'hold':''}`;b.dataset.id=c.cueId;const meta=document.createElement('div');meta.className='meta';const stamp=document.createElement('span');stamp.textContent=`${String(i+1).padStart(2,'0')} / 原片 ${c.suggestedStartTime.toFixed(2)}–${c.suggestedEndTime.toFixed(2)}s`;const badge=document.createElement('span');badge.className='badge';badge.textContent=(c.delivery==='pause'||c.convertedToHold)?`定格 ${(c.holdDuration??c.previewEnd-c.previewStart).toFixed(1)}秒`:'同步';meta.append(stamp,badge);const p=document.createElement('p');p.textContent=c.text;const focus=document.createElement('small');focus.textContent=(c.delivery==='pause'||c.convertedToHold)?`定格在原片 ${c.holdSourceTime.toFixed(2)}s · ${c.focus}`:c.focus;b.append(meta,p,focus);b.onclick=()=>jump(c.previewStart+.1);list.append(b);const marker=document.createElement('i');marker.className=(c.delivery==='pause'||c.convertedToHold)?'hold':'';marker.style.left=`${c.previewStart/clip.duration*100}%`;marker.style.width=`${(c.previewEnd-c.previewStart)/clip.duration*100}%`;marker.title=c.text;marker.onclick=()=>jump(c.previewStart+.1);timeline.append(marker)});const head=document.createElement('span');head.className='head';timeline.append(head);update();}
DATA.clips.forEach((c,i)=>{const button=document.createElement('button');button.role='tab';button.textContent=c.title;button.onclick=()=>select(i);document.querySelector('.tabs').append(button)});
play.onclick=()=>video.paused?video.play().catch(()=>status.textContent='请使用视频控件开始播放'):video.pause();document.querySelector('#restart').onclick=()=>{video.currentTime=0;video.play().catch(()=>{})};video.addEventListener('timeupdate',update);video.addEventListener('loadedmetadata',update);video.addEventListener('error',()=>status.textContent='视频加载失败，请检查 MP4 文件是否与预览页位于同一目录。');select(0);tick();
</script></html>
